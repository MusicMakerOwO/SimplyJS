name: CI (Deno)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: latest

      - name: Install dependencies
        run: deno install

      - name: Build
        run: deno task build

      - name: Test
        run: deno task test
