name: CI (Deno)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      EXPECTED_RUNTIME: deno

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: latest

      - name: Install dependencies
        run: deno install

      - name: Build
        run: deno task build

      # src/Tests/Runtime.test.ts fails the job if this ends up running vitest on Node instead
      - name: Test
        run: deno task test

      # gateway lifecycle against a real socket, on the built dist/ this job just produced
      - name: Integration
        run: deno run -A scripts/integration/gateway.mjs
